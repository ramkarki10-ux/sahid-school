<!-- 3.2 MAIN BRANDING HEADER -->
<div class="bg-white border-b border-slate-200 py-3 px-4 sm:px-8 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        
        <!-- Left: Small Compact Header Logo + Typography -->
        <a href="/" class="flex items-center gap-3.5 sm:gap-4 group no-underline text-inherit">
            <!-- Small Compact School Logo (55-75px Desktop, 42-50px Mobile) -->
            <div class="flex-shrink-0 flex items-center justify-center">
                <img 
                    src="{{ settings.logo_url or '/static/images/logo_header.png' }}" 
                    alt="सहिद स्मृति आवासीय माध्यमिक विद्यालय लोगो" 
                    class="h-12 w-auto sm:h-16 max-h-[72px] object-contain transition duration-200 group-hover:scale-105"
                    style="aspect-ratio: auto; max-width: 110px;"
                >
            </div>

            <!-- School Identity Typography -->
            <div class="flex flex-col justify-center">
                <h1 class="text-base sm:text-xl lg:text-2xl font-bold text-instBlue leading-tight tracking-tight">
                    {{ settings.name_ne }}
                </h1>
                
                <div class="flex flex-wrap items-center gap-x-2 text-xs text-slate-600 font-medium mt-0.5">
                    <span class="text-slate-800 flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3 h-3 text-red-600 inline"></i>
                        {{ settings.address_ne }}
                    </span>
                    <span class="text-slate-400">•</span>
                    <span class="bg-amber-100 text-amber-900 px-1.5 py-0.2 rounded font-semibold text-[11px]">
                        स्थापना: {{ settings.established_ne }}
                    </span>
                </div>

                <p class="text-[11px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wide mt-0.5 hidden xs:block">
                    {{ settings.name_en }}
                </p>
            </div>
        </a>

        <!-- Right Quick Actions -->
        <div class="hidden lg:flex items-center gap-3">
            <a href="/admission" class="inline-flex items-center gap-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3.5 py-2 rounded-md shadow-sm transition transform hover:-translate-y-0.5">
                <i data-lucide="sparkles" class="w-4 h-4 text-amber-300"></i>
                <span>अनलाइन भर्ना आवेदन</span>
            </a>
            <a href="/contact" class="inline-flex items-center gap-1.5 border border-instBlue text-instBlue hover:bg-instBlue hover:text-white text-xs font-semibold px-3 py-2 rounded-md transition">
                <i data-lucide="phone" class="w-3.5 h-3.5"></i>
                <span>सम्पर्क गर्नुहोस्</span>
            </a>
        </div>

        <!-- Mobile Hamburger Toggle Button -->
        <div class="lg:hidden flex items-center">
            <button id="mobileMenuBtn" type="button" class="p-2 rounded-md text-instBlue hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-instBlue" aria-label="Toggle Navigation">
                <i data-lucide="menu" class="w-7 h-7"></i>
            </button>
        </div>
    </div>
</div>
