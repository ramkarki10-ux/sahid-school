<!-- 3.1 TOP BAR / UTILITY HEADER -->
<div class="bg-instBlue-dark text-slate-200 text-xs py-1.5 px-4 sm:px-8 border-b border-instBlue-light/40">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-2">
        <!-- Left: Contact Details -->
        <div class="flex flex-wrap items-center gap-3 sm:gap-5 font-medium">
            <a href="tel:9852033133" class="flex items-center gap-1.5 hover:text-white transition">
                <i data-lucide="phone-call" class="w-3.5 h-3.5 text-instGold-light"></i>
                <span>फोन: <strong class="font-semibold text-white">९८५२०३३१३३ / ९८४१५५२८५७</strong></span>
            </a>
            <a href="tel:9841552857" class="hidden md:flex items-center gap-1.5 hover:text-white transition">
                <i data-lucide="megaphone" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>सूचना बोर्ड: <span class="text-white font-semibold">९८४१५५२८५७</span></span>
            </a>
            <a href="mailto:{{ settings.email }}" class="hidden lg:flex items-center gap-1.5 hover:text-white transition">
                <i data-lucide="mail" class="w-3.5 h-3.5 text-sky-400"></i>
                <span>{{ settings.email }}</span>
            </a>
        </div>

        <!-- Right: Social, Language, Parent Portal, Login -->
        <div class="flex items-center gap-2.5 sm:gap-3.5 ml-auto">
            <!-- Social Icons -->
            <div class="flex items-center gap-1.5 text-slate-300">
                <a href="{{ settings.facebook_url or 'https://www.facebook.com/profile.php?id=100092258731456' }}" target="_blank" rel="noopener" class="w-6 h-6 rounded-full bg-instBlue/80 hover:bg-blue-600 flex items-center justify-center transition" title="आधिकारिक फेसबुक पेज">
                    <i data-lucide="facebook" class="w-3.5 h-3.5 text-white"></i>
                </a>
                {% if settings.youtube_url %}
                <a href="{{ settings.youtube_url }}" target="_blank" rel="noopener" class="w-6 h-6 rounded-full bg-instBlue/80 hover:bg-red-600 flex items-center justify-center transition" title="YouTube">
                    <i data-lucide="youtube" class="w-3.5 h-3.5 text-white"></i>
                </a>
                {% endif %}
            </div>

            <!-- Parent Portal Link -->
            <a href="/parent/login" class="flex items-center gap-1 bg-amber-500/90 hover:bg-amber-500 text-slate-900 px-2 py-0.5 rounded transition font-bold text-[11px] shadow-sm">
                <i data-lucide="users" class="w-3 h-3 text-slate-900"></i>
                <span>अभिभावक पोर्टल</span>
            </a>

            <!-- Download Button -->
            <a href="/download" class="flex items-center gap-1 bg-emerald-600/90 hover:bg-emerald-600 text-white px-2 py-0.5 rounded transition font-bold text-[11px] shadow-sm" title="वेबसाइट तथा ब्याकअप डाउनलोड गर्नुहोस्">
                <i data-lucide="download" class="w-3 h-3 text-white"></i>
                <span>डाउनलोड</span>
            </a>

            <!-- Language Switcher -->
            <div class="inline-flex rounded border border-instBlue-light overflow-hidden text-[11px] font-bold">
                <button type="button" class="px-2 py-0.5 bg-instGold text-white">NP</button>
                <button type="button" class="px-2 py-0.5 bg-instBlue text-slate-300 hover:text-white">EN</button>
            </div>

            <!-- Portal Login link -->
            {% if current_user %}
            <a href="{% if current_user.role == 'TEACHER' %}/teacher/dashboard{% else %}/admin/dashboard{% endif %}" class="flex items-center gap-1 bg-instGold-dark hover:bg-instGold text-white px-2.5 py-0.5 rounded transition font-semibold text-xs shadow-sm">
                <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i>
                <span>ड्यासबोर्ड</span>
            </a>
            {% else %}
            <a href="/login" class="flex items-center gap-1 bg-white/10 hover:bg-white/20 text-white px-2 py-0.5 rounded transition font-medium text-xs">
                <i data-lucide="log-in" class="w-3 h-3 text-instGold-light"></i>
                <span>कर्मचारी लगइन</span>
            </a>
            {% endif %}
        </div>
    </div>
</div>
