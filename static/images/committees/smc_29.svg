<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="grad_smc_29" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <filter id="shadow_smc_29" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#grad_smc_29)" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.1" />

  <!-- Avatar Group -->
  <g filter="url(#shadow_smc_29)">
    
        <!-- Female Hair (Bun & Sides) -->
        <circle cx="200" cy="140" r="82" fill="#1c1917"/>
        <ellipse cx="200" cy="90" rx="50" ry="35" fill="#1c1917"/>
        <path d="M 125 150 Q 120 220 145 250 Q 160 210 160 170 Z" fill="#1c1917"/>
        <path d="M 275 150 Q 280 220 255 250 Q 240 210 240 170 Z" fill="#1c1917"/>
        

    <!-- Neck -->
    <rect x="175" y="215" width="50" height="45" rx="6" fill="#e4bc9f" />

    <!-- Face Oval -->
    <ellipse cx="200" cy="165" rx="55" ry="65" fill="#f5d0b5" />

    

    <!-- Ears -->
    <ellipse cx="145" cy="165" rx="9" ry="16" fill="#e4bc9f" />
    <ellipse cx="255" cy="165" rx="9" ry="16" fill="#e4bc9f" />

    <!-- Eyebrows -->
    <path d="M 165 142 Q 180 138 190 144" stroke="#292524" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 235 142 Q 220 138 210 144" stroke="#292524" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <ellipse cx="177" cy="153" rx="6" ry="4" fill="#1c1917" />
    <circle cx="179" cy="151" r="1.5" fill="#ffffff" />
    <ellipse cx="223" cy="153" rx="6" ry="4" fill="#1c1917" />
    <circle cx="225" cy="151" r="1.5" fill="#ffffff" />

    <!-- Nose -->
    <path d="M 200 152 L 200 175 L 206 177" stroke="#e4bc9f" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Smile / Lips -->
    <path d="M 184 193 Q 200 205 216 193" stroke="#be123c" stroke-width="3.5" stroke-linecap="round" fill="none" />

    
        <!-- Female Blouse & Saree / Coat -->
        <path d="M 110 400 L 140 260 L 260 260 L 290 400 Z" fill="#0f172a"/>
        <!-- Saree Pallu across shoulder -->
        <path d="M 120 400 L 155 260 L 220 260 L 170 400 Z" fill="#e11d48" opacity="0.95"/>
        <path d="M 155 260 Q 200 290 245 260" stroke="#fbbf24" stroke-width="3" fill="none"/>
        
  </g>

  <!-- Bottom Badge: School Initial / Role -->
  <rect x="20" y="340" width="360" height="45" rx="10" fill="#0f172a" fill-opacity="0.85" />
  <text x="200" y="368" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">राम कुमारी चौधरी</text>
</svg>